name: DataBridge tests

on:
  push:
    paths:
      - "projects/databridge-integration/**"
      - ".github/workflows/databridge-tests.yml"
  pull_request:
    paths:
      - "projects/databridge-integration/**"
      - ".github/workflows/databridge-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/databridge-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/databridge-integration/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
